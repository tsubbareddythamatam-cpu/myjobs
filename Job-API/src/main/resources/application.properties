# Configure company board slugs as additional feeds when you have specific employers to search.
# Replace the sample Greenhouse, Lever and Ashby board slugs above with employers you want to search.
# Workable: workable-json / https://apply.workable.com/api/v1/widget/accounts/{slug}?details=true
# SmartRecruiters: smartrecruiters-json / https://api.smartrecruiters.com/v1/companies/{slug}/postings?limit=100&offset=0
# Recruitee: recruitee-json / https://{slug}.recruitee.com/api/offers/
# Breezy HR: breezy-json / https://{slug}.breezy.hr/json
# Personio: personio-xml / https://{slug}.jobs.personio.de/xml?language=en
# Teamtailor: teamtailor-rss / https://{slug}.teamtailor.com/jobs.rss
# Rippling: rippling-json / https://ats.rippling.com/api/v2/board/{slug}/jobs?page=1