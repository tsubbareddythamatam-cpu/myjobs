#changing the server port
server.port=8089
server.address=127.0.0.1

#db specific properties
spring.datasource.url=jdbc:mysql://localhost:3306/myjobs?createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

#ORM s/w specific properties

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#enable swagger
spring.mvc.pathmatch.matching-strategy = ANT_PATH_MATCHER

#validation-exception activate
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
#file configuration
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=41MB
server.tomcat.max-swallow-size=41MB
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5:7b}
spring.ai.retry.max-attempts=1
jobsearch.ai.matching.enabled=${JOB_AI_MATCHING_ENABLED:false}
jobsearch.jwt.secret=${JWT_SECRET:}
jobsearch.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# G Mail Configuration

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000



jobsearch.app.base-url=${APP_BASE_URL:http://localhost:8089}
jobsearch.auth.email-verification-ttl-seconds=${EMAIL_VERIFICATION_TTL_SECONDS:86400}
jobsearch.auth.password-reset-ttl-seconds=${PASSWORD_RESET_TTL_SECONDS:1800}
jobsearch.notifications.enabled=${JOB_NOTIFICATIONS_ENABLED:false}
jobsearch.notifications.recipient=${JOB_NOTIFICATION_RECIPIENT:}

# Job boards shown in the dashboard. Keep login and application submission on each site.
jobsearch.resume-path=${JOB_RESUME_PATH:}
jobsearch.resume-storage-dir=${JOB_RESUME_STORAGE_DIR:./data/resumes}
jobsearch.cache.refresh-interval-ms=900000
jobsearch.cache.redis-ttl-ms=${JOB_CACHE_REDIS_TTL_MS:900000}
jobsearch.company-discovery.enabled=${JOB_COMPANY_DISCOVERY_ENABLED:false}
